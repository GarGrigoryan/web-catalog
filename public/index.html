<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Product Catalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <header class="bg-white shadow sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-gray-800">📦 Ապրանքների Ցուցասրահ</h1>
            <input type="text" id="catalogSearch" placeholder="🔍 Որոնել ապրանք..." class="px-4 py-2 border rounded-lg text-sm w-full sm:w-72 outline-none focus:ring-2 focus:ring-indigo-500">
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Dynamic product cards render here -->
        </div>
    </main>

    <script>
        let allProducts = [];

        async function fetchCatalog() {
            try {
                const res = await fetch('/api/catalog/items');
                allProducts = await res.json();
                renderCatalog(allProducts);
            } catch (err) {
                console.error("Failed to load catalog:", err);
            }
        }

        function renderCatalog(items) {
            const grid = document.getElementById('productGrid');
            if (!items.length) {
                grid.innerHTML = `<p class="col-span-full text-center text-gray-400 py-12">Առկա ապրանքներ չկան:</p>`;
                return;
            }

            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-lg shadow hover:shadow-md transition overflow-hidden flex flex-col justify-between border">
                    <img src="${item.image_url || 'https://via.placeholder.com/300x200?text=No+Image'}"
                         alt="${item.name}"
                         class="w-full h-48 object-cover bg-gray-50">
                    <div class="p-4 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="text-lg font-bold text-gray-800">${item.name}</h3>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-2">${item.description || 'Նկարագրություն չկա:'}</p>
                        </div>
                        <div class="mt-4 pt-3 border-t flex items-center justify-between">
                            <span class="text-lg font-extrabold text-indigo-600">${Math.round(item.price).toLocaleString()} AMD</span>
                            <span class="text-xs bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-semibold">
                                Առկա է: ${item.quantity} հատ
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('catalogSearch').addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase().trim();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q)));
            renderCatalog(filtered);
        });

        fetchCatalog();
    </script>
</body>
</html>
